# Data
data:
  norman_path: "/large_storage/goodarzilab/shervin/scCausalRL/Norman/"
  replogle_path: "/large_storage/goodarzilab/shervin/scCausalRL/Replogle/"
  waddington_path: "/large_storage/goodarzilab/shervin/scCausalRL/Waddington_OT/"
  n_hvg: 2000
  dataset: "norman"  # which dataset for training
  split_seed: 42                     # reproducible gene split
  single_pert_train_frac: 0.8        # 80% of single-pert genes for training
  single_pert_val_frac: 0.1          # 10% for validation, 10% for test

# Model
model:
  latent_dim: 64
  tau_init: 1.0
  tau_min: 0.25
  n_dag_samples: 16
  dagma_s: 1.0

# Phase 1: VAE training
phase1:
  n_epochs: 150
  batch_size: 256
  lr: 1.0e-3
  beta_start: 0.01
  beta_end: 0.5                    # proposal: anneal to 0.5, not 1.0
  beta_anneal_epochs: 50
  lambda_pert: 10.0
  lambda_sparse: 1.0
  lambda_spectral: 1.0
  lambda_ortho: 1.0
  lambda_D_sparse: 0.001            # L1 on entries of decoder D (gene-level sparsity)
  lambda_prior: 0.1
  dagma_rho_init: 1.0
  dagma_rho_max: 100
  dagma_lambda_init: 0.0
  reconstruction_phase_epochs: 20  # epochs before activating DAG
  lr_warmup_epochs: 5              # linear LR warmup from ~0 to lr
  dag_warmin_epochs: 10            # ramp DAG losses from 0→1 after activation
  accumulation_steps: 4            # gradient accumulation (effective batch = batch_size * this)
  pert_n_dag_samples: 8            # DAG samples for perturbation consistency loss
  pert_mutilate_threshold_frac: 0.1  # multi-column mutilation: zero columns where |dε| > frac * max|dε|

# Intervention / do-operator scheme
#   threshold : legacy multi-column mutilation gated by threshold_frac · max|dε|
#   u_score   : decoder-loading scheme. u_i = Σ L[g,:] (L[g,i]=D[g,i]²/Σ_h D[h,i]²);
#               eps_tilde = u⊙z_target + (1−u)⊙eps; A_tilde = A·diag(1−u).
#               u_i=1 recovers classical do(z_i=z_target_i); u_i=0 is identity.
intervention:
  scheme: "threshold"      # one of {threshold, u_score}
  u_clip_max: 1.0          # clip u_i to [0, u_clip_max] for numerical safety
  u_accumulate: true       # monotonically accumulate u across RL/eval episode steps
  knockout_clamp: true     # in RL+multi-step eval, set x[g]=0 for persisted knockouts before next dx

# Phase 2: Joint training
phase2:
  n_iterations: 50000
  vae_lr: 1.0e-4
  policy_lr: 3.0e-4
  critic_lr: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  n_epochs_per_update: 4
  n_steps_per_rollout: 2048
  ppo_batch_size: 64
  max_episode_steps: 3
  n_actions_per_gene: 2            # knockout + overexpress (proposal: |A| = G × 2)
  alpha_pessimism: 1.0
  beta_explore: 0.1
  lambda_cost: 0.1
  policy_relevance_upweight: 3.0
  vae_update_every: 10
  recluster_every: 1000
  leiden_resolution: 1.0           # Leiden clustering resolution
  leiden_n_neighbors: 15           # kNN graph neighbors for Leiden

# Weights & Biases logging
wandb:
  enabled: true
  project: "scCausalRL"
  entity: null          # set to your wandb username / team, or leave null
  phase1_run_name: null # null = auto-generated
  phase2_run_name: null

# Evaluation
eval:
  n_dag_samples: 32
  combo_holdout_frac: 1.0
