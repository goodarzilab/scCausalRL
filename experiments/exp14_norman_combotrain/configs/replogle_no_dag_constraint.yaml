# Replogle-only Phase 1 training WITHOUT acyclicity (DAGMA) constraint.
#
# Same as configs/replogle.yaml but with DAGMA augmented Lagrangian zeroed:
#   - lambda_dagma stays at 0 (no linear penalty on h(A))
#   - rho_dagma stays at 0 (no quadratic penalty on h(A))
#   - rho_max = 0 (Lagrangian update can't grow rho)
#
# The h(A) constraint value is STILL computed and logged each epoch — we can
# observe how cyclic the learned graph becomes without the constraint forcing it.
# A is allowed to be cyclic; this is an ablation to test whether the acyclicity
# constraint is necessary or if the rest of the loss (sparsity + spectral + pert)
# is sufficient.

data:
  norman_path: "/large_storage/goodarzilab/shervin/scCausalRL/Norman/"
  replogle_path: "/large_storage/goodarzilab/causal_state/pretrain_data/replogle"
  waddington_path: "/large_storage/goodarzilab/shervin/scCausalRL/Waddington_OT/"
  n_hvg: 2000
  dataset: "replogle"
  replogle_cell_line: "k562"
  replogle_max_cells: 200000
  split_seed: 42
  single_pert_train_frac: 0.8
  single_pert_val_frac: 0.1

model:
  latent_dim: 64
  tau_init: 1.0
  tau_min: 0.25
  n_dag_samples: 16
  dagma_s: 1.0

phase1:
  n_epochs: 150
  batch_size: 256
  lr: 1.0e-3
  beta_start: 0.01
  beta_end: 0.5
  beta_anneal_epochs: 50
  lambda_pert: 10.0
  lambda_sparse: 1.0
  lambda_spectral: 1.0
  lambda_ortho: 1.0
  lambda_prior: 0.1
  # ── DAGMA acyclicity constraint disabled (ablation) ──
  dagma_rho_init: 0.0          # zero quadratic penalty coefficient
  dagma_rho_max: 0.0           # prevent ρ from growing during Lagrangian updates
  dagma_lambda_init: 0.0       # zero linear penalty coefficient
  # ──────────────────────────────────────────────────────
  reconstruction_phase_epochs: 20
  lr_warmup_epochs: 5
  dag_warmin_epochs: 10
  accumulation_steps: 4
  pert_n_dag_samples: 8
  pert_mutilate_threshold_frac: 0.1

phase2:
  n_iterations: 50000
  vae_lr: 1.0e-4
  policy_lr: 3.0e-4
  critic_lr: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  n_epochs_per_update: 4
  n_steps_per_rollout: 2048
  ppo_batch_size: 64
  max_episode_steps: 3
  n_actions_per_gene: 2
  alpha_pessimism: 1.0
  beta_explore: 0.1
  lambda_cost: 0.1
  policy_relevance_upweight: 3.0
  vae_update_every: 10
  recluster_every: 1000
  leiden_resolution: 1.0
  leiden_n_neighbors: 15

wandb:
  enabled: true
  project: "scCausalRL"
  entity: null
  phase1_run_name: "phase1_replogle_no_dag_constraint"
  phase2_run_name: "phase2_replogle_no_dag_constraint"

eval:
  n_dag_samples: 32
  combo_holdout_frac: 1.0
