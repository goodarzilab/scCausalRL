# Tiny real-data smoke for exp7 (shift + linear + MMD + cosine).
data:
  norman_path: "/large_storage/goodarzilab/shervin/CausalBioRL/Norman/"
  replogle_path: "/large_storage/ctc/userspace/aadduri/revisions/replogle_unfiltered/K562_essential_raw_singlecell_01.h5ad"
  waddington_path: "/large_storage/goodarzilab/shervin/CausalBioRL/Waddington_OT/"
  n_hvg: 3000
  dataset: "replogle"
  replogle_cell_line: "k562"
  replogle_max_cells: 12000
  split_seed: 42
  single_pert_train_frac: 0.8
  single_pert_val_frac: 0.1

model:
  latent_dim: 64
  tau_init: 1.0
  tau_min: 0.25
  n_dag_samples: 16
  dagma_s: 1.0
  decoder_type: "linear"
  use_shift_encoder: true
  shift_label_dim: 50
  shift_hidden: 1024
  shift_n_layers: 1
  shift_output_activation: "none"
  shift_scale_init: 1.0
  shift_pca_max_ctrl: 1000

phase1:
  n_epochs: 3
  batch_size: 128
  lr: 1.0e-3
  beta_start: 0.01
  beta_end: 0.5
  beta_anneal_epochs: 2
  lambda_pert: 10.0
  lambda_sparse: 10.0
  lambda_sparse_mode: "product"
  lambda_spectral: 0.1
  lambda_ortho: 1.0
  lambda_D_sparse: 30.0
  lambda_prior: 10.0
  prior_margin: 0.5
  dagma_rho_init: 0.0
  dagma_rho_max: 0.0
  dagma_lambda_init: 0.0
  reconstruction_phase_epochs: 1
  lr_warmup_epochs: 1
  dag_warmin_epochs: 1
  accumulation_steps: 1
  pert_n_dag_samples: 1
  cell_sentence_S: 16
  n_sentences_per_block: 2
  min_block_cells: 3
  sentence_batch_size: 1
  pert_mse_weight: 0.0
  pert_cos_weight: 1.0
  pert_mmd_weight: 1.0
  pert_energy_weight: 0.0

intervention:
  scheme: "shift"
  u_clip_max: 0.5

wandb:
  enabled: false
  project: "CausalBioRL"

eval:
  n_dag_samples: 8
  combo_holdout_frac: 1.0
