# Replogle-only Phase 1 training (K562 CRISPRi)
# All K562 cells (~186k), no modality token, single-modality setup.
# Norman is used as external validation only (see scripts/validate_norman.sbatch).

data:
  norman_path: "/large_storage/goodarzilab/shervin/scCausalRL/Norman/"
  replogle_path: "/large_storage/goodarzilab/causal_state/pretrain_data/replogle"
  waddington_path: "/large_storage/goodarzilab/shervin/scCausalRL/Waddington_OT/"
  n_hvg: 2000
  dataset: "replogle"
  replogle_cell_line: "k562"
  replogle_max_cells: 200000          # all K562 cells (~186k)
  # No grid subsample — full K562 (~186k) is used for both single-cell verification
  # and the full grid search.  The cell-sentence loader handles per-block sampling.
  split_seed: 42
  single_pert_train_frac: 0.8
  single_pert_val_frac: 0.1

model:
  latent_dim: 64
  tau_init: 1.0
  tau_min: 0.25
  n_dag_samples: 16
  dagma_s: 1.0

phase1:
  n_epochs: 150
  batch_size: 256
  lr: 1.0e-3
  beta_start: 0.01
  beta_end: 0.5
  beta_anneal_epochs: 50
  lambda_pert: 10.0
  lambda_sparse: 1.0
  lambda_spectral: 1.0
  lambda_ortho: 1.0
  lambda_D_sparse: 0.001
  lambda_prior: 0.1
  dagma_rho_init: 1.0
  dagma_rho_max: 100
  dagma_lambda_init: 0.0
  reconstruction_phase_epochs: 20
  lr_warmup_epochs: 5
  dag_warmin_epochs: 10
  accumulation_steps: 4
  pert_n_dag_samples: 8
  pert_mutilate_threshold_frac: 0.1

  # u-score / cell-sentence Phase-1 training (used when intervention.scheme == u_score):
  cell_sentence_S: 64                 # cells per sentence (set size)
  n_sentences_per_block: 4            # sentences drawn per (gene, gem_group) block per epoch
  min_block_cells: 8                  # drop (gene, gem_group) blocks smaller than this
  sentence_batch_size: 8              # sentences per training step
  pert_loss_kind: "energy"            # "energy" (geomloss SamplesLoss), "mmd_rbf", or "mse"

intervention:
  scheme: "threshold"
  u_clip_max: 1.0
  u_accumulate: true
  knockout_clamp: true

phase2:
  n_iterations: 50000
  vae_lr: 1.0e-4
  policy_lr: 3.0e-4
  critic_lr: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  n_epochs_per_update: 4
  n_steps_per_rollout: 2048
  ppo_batch_size: 64
  max_episode_steps: 3
  n_actions_per_gene: 2
  alpha_pessimism: 1.0
  beta_explore: 0.1
  lambda_cost: 0.1
  policy_relevance_upweight: 3.0
  vae_update_every: 10
  recluster_every: 1000
  leiden_resolution: 1.0
  leiden_n_neighbors: 15

wandb:
  enabled: true
  project: "scCausalRL"
  entity: null
  phase1_run_name: "phase1_replogle"
  phase2_run_name: "phase2_replogle"

eval:
  n_dag_samples: 32
  combo_holdout_frac: 1.0
