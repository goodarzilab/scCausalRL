  pert_mutilate_beta: 1.0
  pert_mutilate_u_mode: shift
  recon_subsample: 150000
  pert_residual_target: false
  pert_contrastive_temp: 0.2
  pert_target_l0: 0.03
  pert_deg_mse_weight: 0.0
  pert_deg_mse_thr: 0.1
  combo_train_frac: 1.0
  init_from_checkpoint: null
