  pert_n_dag_samples: 1
  cell_sentence_S: 64
  n_sentences_per_block: 4
  min_block_cells: 3
  sentence_batch_size: 32
  pert_mse_weight: 1.0
  pert_mmd_weight: 1.0
  pert_energy_weight: 0.0
  pert_shift_l1: 0.0
  pert_contrastive_weight: 1.0
  pert_loss_mode: shift_mutilate
