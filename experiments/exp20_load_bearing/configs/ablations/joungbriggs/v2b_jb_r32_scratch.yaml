# Joung (day7) + Briggs (day14/28 HSPC) JOINT modality-conditioned WM, from scratch, head ON.
# Vocab stays 4366; Briggs cells are scored ONLY on the ~2800 shared genes (per-modality gene mask,
# zero-filled rest incur no gradient). HSPC synergy pairs + P1/P2 sub-combos held out for honest eval.
data:
  dataset: joung_briggs
  joung_proc_path: /large_storage/goodarzilab/shervin/CausalBioRL/Joung_TF_Atlas/vocab_v2/joung_singles_proc_v2b.h5ad
  joung_combo_proc_path: /large_storage/goodarzilab/shervin/CausalBioRL/Joung_TF_Atlas/vocab_v2/joung_combo_proc_v2b.h5ad
  n_hvg: null
  split_seed: 1
  single_pert_train_frac: 1.0
  single_pert_val_frac: 0.0
  min_cells_per_pert: 5
  min_combo_cells: 20
  effective_tfs: /large_storage/goodarzilab/shervin/CausalBioRL/Joung_TF_Atlas/vocab_v2/effective_tf_genes.txt
  load_combos: true
model:
  latent_dim: 64
  tau_init: 1.0
  tau_min: 0.25
  n_dag_samples: 16
  dagma_s: 1.0
  decoder_type: masked_go
  use_shift_encoder: true
  shift_descriptor: esm
  shift_label_dim: 100
  shift_pca_dim: 50
  shift_hidden: 1024
  shift_n_layers: 1
  shift_output_activation: none
  shift_scale_init: 1.0
  shift_pca_max_ctrl: 2000
  shift_esm_dim: 100
  model_impl: exp20
  pert_intervene_mode: structural
  use_target_gate: true
  dec_mask_lambda: 0.3
  dec_mask_freeze: false
  masked_go_max_pathways: null
  interaction_rank: 32
phase1:
