  batch_size: 256
  lr: 0.001
  beta_start: 0.01
  beta_end: 0.5
  beta_anneal_epochs: 30
  lambda_pert: 10.0
  lambda_sparse: 0.0
  lambda_sparse_mode: product
  lambda_spectral: 0.1
  lambda_ortho: 0.0
  lambda_D_sparse: 0.0
  lambda_prior: 0.0
  prior_margin: 0.5
  dagma_rho_init: 0.0
