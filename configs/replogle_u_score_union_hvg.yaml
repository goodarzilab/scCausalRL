# Replogle K562 Phase 1 with HVG axis force-expanded to cover Norman's perturbed
# gene set. Identical to configs/replogle_u_score.yaml in every other respect.
#
# Motivation: the original Replogle HVG selection (top 2000 most variable in
# CRISPRi K562) overlaps Norman's 105 perturbed genes only ~19 times. That
# bottlenecks Norman external eval to 19/105 singles and 4/131 combos. Setting
# data.force_include_norman_perts=true ORs Norman's perturbed gene set into the
# HVG mask so n_genes ≈ 2086 and Norman eval covers ~all perturbations.
#
# Trade-off: ~4% more parameters (D, A, encoder input head), negligible compute.

data:
  norman_path: "/large_storage/goodarzilab/shervin/scCausalRL/Norman/"
  # Pointed at K562_gwps_filtered.h5ad directly (not the directory) so we get the
  # wider 8,248-gene var space instead of train_v5.h5ad's 4,096. With union HVG
  # this gives 54/105 Norman pert genes evaluable (vs 27 with train_v5).
  # File is already K562-only and has no `cell_line` column — load_replogle.py
  # handles that.
  replogle_path: "/large_storage/goodarzilab/causal_state/pretrain_data/replogle/K562_gwps_filtered.h5ad"
  waddington_path: "/large_storage/goodarzilab/shervin/scCausalRL/Waddington_OT/"
  n_hvg: 2000
  dataset: "replogle"
  replogle_cell_line: "k562"
  replogle_max_cells: 200000
  split_seed: 42
  single_pert_train_frac: 0.8
  single_pert_val_frac: 0.1
  force_include_norman_perts: true   # union HVG with Norman pert genes

model:
  latent_dim: 64
  tau_init: 1.0
  tau_min: 0.25
  n_dag_samples: 16
  dagma_s: 1.0

phase1:
  n_epochs: 150
  batch_size: 256
  lr: 1.0e-3
  beta_start: 0.01
  beta_end: 0.5
  beta_anneal_epochs: 50
  lambda_pert: 10.0
  lambda_sparse: 10.0
  lambda_spectral: 0.1
  lambda_ortho: 1.0
  lambda_D_sparse: 30.0
  lambda_prior: 10.0
  prior_margin: 0.5
  dagma_rho_init: 0.0
  dagma_rho_max: 0.0
  dagma_lambda_init: 0.0
  reconstruction_phase_epochs: 20
  lr_warmup_epochs: 5
  dag_warmin_epochs: 10
  accumulation_steps: 4
  pert_n_dag_samples: 1
  pert_mutilate_threshold_frac: 0.1

  cell_sentence_S: 64
  n_sentences_per_block: 4
  min_block_cells: 3
  sentence_batch_size: 8
  pert_loss_kind: "mse"
  pert_match_delta: true

intervention:
  scheme: "u_score"
  u_clip_max: 0.5
  u_accumulate: true
  knockout_clamp: true
  combo_mode: "parallel"

phase2:
  n_iterations: 50000
  vae_lr: 1.0e-4
  policy_lr: 3.0e-4
  critic_lr: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  n_epochs_per_update: 4
  n_steps_per_rollout: 2048
  ppo_batch_size: 64
  max_episode_steps: 3
  n_actions_per_gene: 2
  alpha_pessimism: 1.0
  beta_explore: 0.1
  lambda_cost: 0.1
  policy_relevance_upweight: 3.0
  vae_update_every: 10
  recluster_every: 1000
  leiden_resolution: 1.0
  leiden_n_neighbors: 15

wandb:
  enabled: true
  project: "scCausalRL"
  entity: null
  phase1_run_name: "phase1_replogle_u_score_union_hvg"
  phase2_run_name: "phase2_replogle_u_score_union_hvg"

eval:
  n_dag_samples: 32
  combo_holdout_frac: 1.0
